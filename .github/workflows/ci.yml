name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        # F (pyflakes) and E9 (syntax) only. These are real defects — an unused
        # import that should have been used, a name that does not exist. Style
        # rules are deliberately excluded: a lint job that fails on formatting
        # trains people to ignore the lint job.
        run: ruff check --select F,E9 rawthink_mcp tests

      - name: Test
        # Integration and measurement tests need a real Qdrant and Ollama and
        # are excluded by the addopts in pyproject. They are opt-in rather than
        # auto-skipped: a suite that silently skips on a missing service
        # reports green for a run that checked nothing.
        run: pytest --cov=rawthink_mcp --cov-report=term-missing

      - name: Templates are in sync
        # install.py embeds five documents so `rawthink-install` works offline.
        # Embedded copies drift silently — one had fallen 65 lines behind before
        # anyone noticed.
        run: python scripts/check_templates.py

  build:
    name: build + sdist hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build
        run: python -m build

      - name: Check metadata
        run: twine check dist/*

      - name: sdist must not ship tests
        # The 0.1.4 sdist contained tests/, whose evaluation fixtures hardcoded
        # personal entity names and session dates. hatchling ships everything
        # not gitignored unless an allowlist says otherwise, so this guards the
        # allowlist rather than trusting it.
        run: |
          leaked=$(tar tzf dist/*.tar.gz | grep -E '(^|/)tests/' || true)
          if [ -n "$leaked" ]; then
            echo "sdist contains tests/:"; echo "$leaked"; exit 1
          fi
          echo "sdist is clean"

      - name: Installs from the sdist
        run: |
          python -m venv /tmp/v
          /tmp/v/bin/pip install dist/*.tar.gz
          /tmp/v/bin/python -c "import rawthink_mcp; print(rawthink_mcp.__name__, 'ok')"
